<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multer demo</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #fff; color: #111; }
    form { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1.5rem; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Загрузка файлов (Multer)</h1>

  <form data-url="/upload/single">
    <h2>single — аватар</h2>
    <input type="text" name="username" placeholder="Имя пользователя">
    <input type="file" name="avatar" accept="image/*">
    <button>Отправить</button>
  </form>

  <form data-url="/upload/multiple">
    <h2>array — несколько фото (до 5)</h2>
    <input type="file" name="photos" multiple accept="image/*">
    <button>Отправить</button>
  </form>

  <form data-url="/upload/fields">
    <h2>fields — аватар + документы</h2>
    <input type="file" name="avatar" accept="image/*">
    <input type="file" name="documents" multiple>
    <button>Отправить</button>
  </form>

  <form data-url="/upload/csv">
    <h2>MemoryStorage — CSV</h2>
    <input type="file" name="table" accept=".csv">
    <button>Отправить</button>
  </form>

  <pre id="result">Результат появится здесь</pre>

  <script>
    document.querySelectorAll('form').forEach((form) => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        // FormData сам формирует multipart/form-data с boundary
        const res = await fetch(form.dataset.url, { method: 'POST', body: new FormData(form) });
        document.getElementById('result').textContent =
          res.status + '\n' + JSON.stringify(await res.json(), null, 2);
      });
    });
  </script>
</body>
</html>
